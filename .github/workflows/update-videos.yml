name: Update videos.json

on:
  schedule:
    - cron: "0 6 * * *"   # daily at 6 AM UTC
  workflow_dispatch:        # allow manual trigger from GitHub UI

jobs:
  update:
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch videos
        run: node fetch-videos.js
        working-directory: emmetsplace
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}

      - name: Build site
        run: node build-site.js
        working-directory: emmetsplace

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for p in emmetsplace/videos.json emmetsplace/slugs.json emmetsplace/index.html emmetsplace/sitemap.xml emmetsplace/llms.txt emmetsplace/episodes emmetsplace/musicians emmetsplace/writers; do
            [ -e "$p" ] && git add -A -- "$p"
          done
          git diff --cached --quiet || git commit -m "chore: update videos.json and generated pages"
          git pull --rebase && git push
